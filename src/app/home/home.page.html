@if (isNative) {
<app-mobile-header
  title="NAV.HOME"
  [showCart]="true"
  [showSearch]="true"
  [scrolled]="scrolled"
/>
} @else {
<ion-header class="ion-no-border">
  <app-browser-header />
</ion-header>
}

<ion-content
  [fullscreen]="true"
  [scrollEvents]="true"
  [style.--padding-top]="isNative ? 'calc(env(safe-area-inset-top) + 80px)' : null"
  (ionScroll)="onScroll($event)"
>
  @if (isNative) {
  <div class="flex flex-col gap-8 px-4 py-6">
    <!-- Section Services -->
    <app-product-list
      [products]="services"
      [isLoading]="isLoading"
      [error]="error ?? undefined"
      title="Top services du moment"
      linkText="Voir tout"
      linkRoute="/catalog"
      variant="mobile"
    />

    <!-- Section Produits -->
    <app-product-list
      [products]="products"
      [isLoading]="isLoading"
      title="Top produits du moment"
      linkText="Voir tout"
      linkRoute="/catalog"
      variant="mobile"
    />
  </div>
  } @else {
  <div class="flex flex-col gap-12 px-8 py-12 max-w-7xl mx-auto">
    <!-- Section Services -->
    <app-product-list
      [products]="services"
      [isLoading]="isLoading"
      [error]="error ?? undefined"
      title="Nos services de cybersecurite"
      linkText="Voir tout"
      linkRoute="/services"
      variant="browser"
    />

    <!-- Section Produits -->
    <app-product-list
      [products]="products"
      [isLoading]="isLoading"
      title="Nos produits"
      linkText="Voir tout"
      linkRoute="/products"
      variant="browser"
    />
  </div>
  }
</ion-content>

@if (isNative) {
<ion-footer class="ion-no-border">
  <app-navbar />
</ion-footer>
}
